# ==============================================================================
# Nginx Reverse Proxy Configuration for PDF Splitter
# ==============================================================================
# Location: /etc/nginx/sites-available/pdf-splitter.conf
# Enable:   ln -s /etc/nginx/sites-available/pdf-splitter.conf /etc/nginx/sites-enabled/
# Test:     nginx -t
# Reload:   systemctl reload nginx
# ==============================================================================

# Rate and connection limiting zones (adjust to match your traffic profile)
limit_req_zone  $binary_remote_addr zone=pdf_splitter_api:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=pdf_splitter_conn:10m;

upstream pdf_splitter_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name splitter.example.com; # Replace with your FQDN

    server_tokens off;

    access_log /var/log/nginx/pdf_splitter_access.log;
    error_log  /var/log/nginx/pdf_splitter_error.log warn;

    # Allow large textbook PDFs while keeping per-connection buffer lean (streaming enabled below)
    client_max_body_size 500M;
    client_body_buffer_size 128k;
    client_body_timeout 300s;
    send_timeout 300s;

    limit_conn pdf_splitter_conn 10;

    # Gzip for static web assets (PDFs and ZIPs are excluded)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # Note: X-Frame-Options, X-Content-Type-Options, Referrer-Policy, and CSP are
    # set by the Go backend to avoid duplicate/conflicting headers.
    # Enable Strict-Transport-Security below once HTTPS is active via Certbot.

    # Rate-limit compute- and storage-intensive endpoints
    location ~ ^/api/(s3/presign|inspect|split)$ {
        limit_req zone=pdf_splitter_api burst=15 nodelay;
        limit_req_status 429;

        proxy_pass http://pdf_splitter_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_request_buffering off;

        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    location / {
        proxy_pass http://pdf_splitter_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_request_buffering off;

        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}

# ------------------------------------------------------------------------------
# HTTPS Server Template (Port 443)
# Recommended: sudo certbot --nginx -d splitter.example.com
# Add this header inside the 443 server block once TLS is verified:
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# ------------------------------------------------------------------------------
