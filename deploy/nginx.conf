# ==============================================================================
# Nginx Reverse Proxy Configuration for Pdf Splitter
# ==============================================================================
# Location: /etc/nginx/sites-available/pdf-plitter.conf
# Enable: ln -s /etc/nginx/sites-available/pdf-plitter.conf /etc/nginx/sites-enabled/
# Test:   nginx -t
# Reload: systemctl reload nginx
# ==============================================================================

# Backend upstream connection pool
upstream book_splitter_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# HTTP Server (Port 80)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name splitter.example.com; # Replace with your server FQDN or IP

    # Logging
    access_log /var/log/nginx/book_splitter_access.log;
    error_log  /var/log/nginx/book_splitter_error.log warn;

    # --------------------------------------------------------------------------
    # Upload & Request Limits
    # Allow large textbook uploads up to 500 Megabytes
    # --------------------------------------------------------------------------
    client_max_body_size 500M;
    client_body_buffer_size 16M;
    client_body_timeout 300s;
    send_timeout 300s;

    # Gzip Compression for Web Assets (excluding PDFs which are already compressed)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # Reverse Proxy Location
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://book_splitter_backend;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Upstream Keepalive Header
        proxy_set_header Connection "";

        # Direct streaming: disable buffering for fast uploads and instant downloads
        proxy_buffering off;
        proxy_request_buffering off;

        # Extended Timeouts for heavy PDF processing and ZIP generation
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}

